<script type="text/javascript">
function FakeClass1MenuShow(a){} 
function MultilingualSwitch(NowStatus){
var langJSON = JSON.parse('{"vn":["Vietnamese","Ti\u1EBFng Vi\u1EC7t"],"en":["English","English"]}');
var langSwitchHtml = '<span class="showLanguage" id="showLanguage">' + langJSON["en"][1] + '</span> <ul class="languageList" id="languageList"> '
for(var item in langJSON)
{
if(langJSON[item][0]!="en")
{
langSwitchHtml += '<li data-value="' + langJSON[item][0] + '">' + langJSON[item][1] + '</li>'
}
}
langSwitchHtml += "</ul>";
$("#languageSwitch").html(langSwitchHtml);
$("#languageSwitch").on("mouseover",function(){
$("#banner").addClass("languageListShow");
$("#languageList").show();
})
$("#languageSwitch").on("mouseout",function(){
$("#languageList").hide();
$("#banner").removeClass("languageListShow");
})
$("#languageList li").click(function(){
$("#languageList").hide();
$("#banner").removeClass("languageListShow");
LanguageSwitch($(this).attr("data-value"), NowStatus);
})
}
function LanguageSwitch(nowLanguage, nowStatus)
{
var changeLanguage = "";

if ( "English" == nowLanguage)
{
changeLanguage = "Vietnamese";
}
else
{
changeLanguage = "English";
}

showWaitTip(true);
if (nowStatus == "showloginPage")
{
_sessionTmpToken = $("#_sessionTOKEN").val();
}
$.post( "/?_type=hiddenData&_tag=switchlang_entry", {IF_LanguageSwitch:changeLanguage, _sessionTOKEN:_sessionTmpToken}, undefined, "json" )
.done(function( data ) {
if ( data.need_refresh )
{
top.location.href = top.location.href;
}
else
{
alert("This page has expired, please refresh and try again. ");
showWaitTip(false);
}
})
.fail(function() {
showWaitTip(false);
alert("Communication with device failed. Please check the network connection. ");
});
}
function showWaitTip(a){
if(a){
var b=$("#page_content");
var c=b.offset().top;
var d=b.height();
var e=c+d/2;
var f=$("#page_container").offset().left;
var g=$("#page_container").width();
var h=$("#blackMask");
h.css({width:g,height:d,top:c,left:f});
h.show();
var i=$("#tipLayer");
i.html("Please wait...");
i.css({top:e,left:f+g/2});
i.show();
return false;
}else{
$("#blackMask").hide();
$("#tipLayer").hide();
}
}
function switchPwd(){
var a=$("#Frm_Password");
if(a.hasClass("passInvisible")){
a.removeClass("passInvisible");
a.addClass("passVisible");
}else{
a.removeClass("passVisible");
a.addClass("passInvisible");
}
}
function PasswordChange(){
var pwd=$("#Frm_Password").val();
if(pwd==""){
alert("Password cannot be empty.");
return false;
}
return true;
}
